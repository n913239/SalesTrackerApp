name: CI-iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer && xcodebuild -version

      - name: Prepare Simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl create "iPhone 16 CI" "iPhone 16" "com.apple.CoreSimulator.SimRuntime.iOS-27-0"

      - name: Build and Test iOS
        run: |
          xcodebuild clean build test \
            -project SalesTrackerApp/SalesTrackerApp.xcodeproj \
            -scheme "CI_iOS" \
            -testPlan "CI_iOS" \
            -destination "platform=iOS Simulator,name=iPhone 16 CI,OS=27.0" \
            -enableThreadSanitizer YES \
            -enableCodeCoverage YES \
            -resultBundlePath build/CI_iOS.xcresult

      - name: Upload Result Bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CI_iOS-xcresult
          path: build/CI_iOS.xcresult
          if-no-files-found: ignore
